# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "hailo-phytec"
BBFILE_PATTERN_hailo-phytec = "^${LAYERDIR}/"
BBFILE_PRIORITY_hailo-phytec = "8"

LAYERDEPENDS_hailo-phytec = "core phytec ampliphy imx-machine-learning"
LAYERSERIES_COMPAT_hailo-phytec = "scarthgap"

# onnxruntime's mlas kernels (core/mlas/lib/*neon*) hardcode -march=armv8.2-a+...
# for their NEON/FP16/dotprod code paths. GCC rejects mixing an explicit -mcpu
# (e.g. cortex-a53+crc+crypto, from the mx8mp board tune) with those -march
# flags on the same command line ("switch ... conflicts with ... switch").
# Forcing the generic aarch64 tune (-march= only, no -mcpu) avoids the clash
# and lets packagegroup-imx-ml (onnxruntime, arm-compute-library) build on any
# i.MX8 board. Set a more generic tuning for code reuse across parts.
DEFAULTTUNE:mx8-generic-bsp    ?= "aarch64"
DEFAULTTUNE:mx8m-generic-bsp   ?= "aarch64"
DEFAULTTUNE:mx8qm-generic-bsp  ?= "aarch64"
DEFAULTTUNE:mx8mp-generic-bsp  ?= "aarch64"
DEFAULTTUNE:mx8x-generic-bsp   ?= "aarch64"
DEFAULTTUNE:mx8ulp-generic-bsp ?= "aarch64"
DEFAULTTUNE:mx9-generic-bsp    ?= "aarch64"
DEFAULTTUNE:mx91-generic-bsp   ?= "aarch64"
DEFAULTTUNE:mx93-generic-bsp   ?= "aarch64"

# omegaconf (required by hailo-model-zoo/hailomz, see
# hailo-python-common-wheels) ships a pre-generated ANTLR grammar tied to
# runtime 4.9.x. meta-openembedded only carries 4.13.1, which fails to
# deserialize it at import time, so pin to our own 4.9.3 recipe.
PREFERRED_VERSION_python3-antlr4-runtime = "4.9.3"