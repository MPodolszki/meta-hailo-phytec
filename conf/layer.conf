# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "hailo-phytec"
BBFILE_PATTERN_hailo-phytec = "^${LAYERDIR}/"
BBFILE_PRIORITY_hailo-phytec = "8"

LAYERDEPENDS_hailo-phytec = "core phytec ampliphy imx-machine-learning"
LAYERSERIES_COMPAT_hailo-phytec = "scarthgap"

# onnxruntime's -mcpu/-march conflict (see its .bbappend) is fixed there,
# scoped to just that recipe -- do NOT force a generic DEFAULTTUNE here,
# it silently retunes every package on the board including u-boot/ATF and
# broke boot (no UART output at all, not even from the bootloader).

# omegaconf (required by hailo-model-zoo/hailomz, see
# hailo-python-common-wheels) ships a pre-generated ANTLR grammar tied to
# runtime 4.9.x. meta-openembedded only carries 4.13.1, which fails to
# deserialize it at import time, so pin to our own 4.9.3 recipe.
PREFERRED_VERSION_python3-antlr4-runtime = "4.9.3"